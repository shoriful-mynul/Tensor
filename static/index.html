<html lang="en">
<head>

<title>Tensor: Find the gaps. Follow the evidence.</title>

<style>
:root {
  --bg: #faf7f0;
  --surface: #fffdf8;
  --ink: #14213d;
  --muted: #475569;
  --line: #ddd5c4;
  --line-strong: #c4baa5;
  --teal: #0f6f68;
  --teal-dark: #0b5a54;
  --teal-bg: #e0f0ed;
  --amber: #7a4e00;
  --amber-bg: #fbeecb;
  --red: #9a2f2f;
  --red-bg: #f7e3e0;
  --grey-bg: #ece7da;
  --radius: 6px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.55;
}
h1, h2, h3 { line-height: 1.25; margin: 0; }
h1 { font-size: 1.65rem; letter-spacing: -0.01em; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
[tabindex="-1"]:focus { outline: none; }
.sr-only {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}
.skip-link {
  position: absolute; left: 8px; top: -60px; background: var(--ink); color: #fff;
  padding: 8px 12px; border-radius: var(--radius); z-index: 100;
}
.skip-link:focus { top: 8px; }

/* Top bar */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 16px;
  padding: 10px 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { flex:none; }
.session-notice { margin:0 0 16px; padding:9px 12px; border:1px solid var(--line); border-left:3px solid var(--amber); border-radius:var(--radius); background:var(--surface); color:var(--muted); font-size:0.85rem; line-height:1.5; }
.session-notice strong { color:var(--ink); }
.brand-name { font-weight: 700; font-size: 1.2rem; letter-spacing: -0.01em; }
.brand-tag { color: var(--muted); font-size: 0.9rem; border-left: 1px solid var(--line); padding-left: 12px; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.mode-badge {
  display: inline-flex; flex-direction: column; line-height: 1.2;
  border: 1px solid var(--amber); background: var(--amber-bg); color: var(--amber);
  border-radius: var(--radius); padding: 4px 10px; font-size: 0.8rem; font-weight: 700;
}
.mode-badge small { font-weight: 500; font-size: 0.72rem; }

/* Shell */
.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: calc(100vh - 58px); }
.nav {
  border-right: 1px solid var(--line);
  padding: 24px 16px;
  background: var(--bg);
  position: sticky; top: 58px; align-self: start; height: calc(100vh - 58px);
}
.nav ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.nav-btn {
  width: 100%; display: grid; grid-template-columns: 28px 1fr; column-gap: 10px; align-items: center;
  text-align: left; background: transparent; border: 1px solid transparent; border-radius: var(--radius);
  padding: 9px 10px; cursor: pointer; min-height: 48px;
}
.nav-btn:hover { background: var(--grey-bg); }
.nav-btn[aria-current="page"] { background: var(--surface); border-color: var(--line-strong); }
.nav-num {
  grid-row: span 2; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line-strong);
  display: inline-flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700;
}
.nav-btn[aria-current="page"] .nav-num { background: var(--ink); border-color: var(--ink); color: #fff; }
.nav-label { font-weight: 650; font-size: 0.95rem; }
.nav-sub { font-size: 0.78rem; color: var(--muted); }

.main { padding: 32px 32px 64px; max-width: 1140px; width: 100%; }
.view { display: grid; gap: 22px; }
.lead { color: var(--muted); max-width: 70ch; }

/* Blocks */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
.panel h2 { margin-bottom: 6px; }
.stack { display: grid; gap: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.notice, .error-box, .info-box {
  border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 12px 14px; background: var(--surface);
}
.info-box { border-color: var(--teal); background: var(--teal-bg); }
.notice { border-color: var(--amber); background: var(--amber-bg); color: #4d3200; }
.error-box { border-color: var(--red); background: var(--red-bg); color: #5f1d1d; }
.error-box ul { margin: 6px 0 0; padding-left: 20px; }
.error-box strong, .notice strong, .info-box strong { display: block; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }

/* Forms */
.field { display: grid; gap: 6px; }
.field > label, legend { font-weight: 650; }
.hint { color: var(--muted); font-size: 0.875rem; }
input[type="text"], input[type="number"], textarea {
  width: 100%; background: #fff; border: 1px solid var(--line-strong); border-radius: var(--radius);
  padding: 9px 11px; min-height: 44px;
}
textarea { resize: vertical; line-height: 1.5; font-family: var(--font); }
input[type="number"] { max-width: 160px; }
.form-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.form-grid > .field { min-width:0; align-content:start; }
.form-grid input[type="text"], .form-grid input[type="number"] { height:44px; }
.form-grid .span-2 { grid-column: 1 / -1; }
fieldset { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin: 0; min-width: 0; background: var(--surface); }
fieldset legend { padding: 0 6px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 8px 16px; border-radius: var(--radius);
  border: 1px solid var(--ink); background: transparent; color: var(--ink);
  font-weight: 650; cursor: pointer; text-decoration: none;
}
.btn:hover { background: var(--grey-bg); }
.btn-primary { background: var(--teal); border-color: var(--teal); color: #fff; }
.btn-primary:hover { background: var(--teal-dark); }
.btn-danger { border-color: var(--red); color: var(--red); }
.btn-small { min-height: 38px; padding: 5px 12px; font-size: 0.9rem; }
.btn[disabled] { opacity: 0.55; cursor: not-allowed; }
.btn-link { border: 0; background: none; padding: 0; min-height: 0; color: var(--teal-dark); text-decoration: underline; font-weight: 600; cursor: pointer; }

.pdf-row { display: grid; grid-template-columns: 160px 1fr; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.pdf-row:first-of-type { border-top: 0; }
.pdf-name { font-family: var(--mono); font-size: 0.85rem; overflow-wrap: anywhere; }

/* Topic editor */
.topic-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.topic-item { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; }
.topic-idx { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }

/* Badges */
.badge {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 4px;
  font-size: 0.85rem; font-weight: 650; white-space: nowrap; border: 1px solid transparent;
}
.badge svg { flex: none; }
.b-covered { background: var(--teal-bg); color: var(--teal-dark); border-color: #a9d4cf; }
.b-partial { background: var(--amber-bg); color: var(--amber); border-color: #e3c981; }
.b-none { background: var(--red-bg); color: var(--red); border-color: #e0b3ae; }
.b-uncertain { background: var(--grey-bg); color: var(--ink); border-color: var(--line-strong); }
.q-badge { background: #fff; border-color: var(--line-strong); color: var(--muted); }
.q-badge.q-ok { border-color: var(--teal); color: var(--teal-dark); }
.q-badge.q-bad { border-color: var(--red); color: var(--red); }

/* Indicators */
.indicators { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
.bar { display: flex; height: 18px; border: 1px solid var(--line-strong); border-radius: 4px; overflow: hidden; background: #fff; margin: 12px 0; }
.bar span { display: block; height: 100%; }
.bar .s-covered { background: var(--teal); }
.bar .s-partial { background: #d9a21b; }
.bar .s-none { background: #b85c5c; }
.bar .s-uncertain { background: #9ca3af; }
.legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.9rem; }
.legend li { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
.big-num { font-size: 1.5rem; font-weight: 700; line-height: 1.2; margin: 6px 0; }

/* Report layout */
.report-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(280px, 1fr); gap: 18px; align-items: start; }
.table-wrap { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow-x: auto; }
table.topic-table { width: 100%; table-layout: fixed; border-collapse: collapse; }
.report-grid > * { min-width: 0; }
.topic-table th, .topic-table td { overflow-wrap: anywhere; }
.topic-table thead th:nth-child(1) { width: 24%; }
.topic-table thead th:nth-child(2) { width: 25%; }
.topic-table thead th:nth-child(3) { width: 33%; }
.topic-table thead th:nth-child(4) { width: 18%; }
.topic-table .badge { max-width: 100%; white-space: normal; overflow-wrap: anywhere; text-align: left; }
.topic-table .btn { min-width: 0; max-width: 100%; white-space: normal; overflow-wrap: anywhere; }
.evidence { min-width: 0; }
.topic-table th, .topic-table td { padding: 12px 14px; text-align: left; vertical-align: middle; border-bottom: 1px solid var(--line); }
.topic-table thead th { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); background: var(--bg); }
.topic-table tbody tr:last-child th, .topic-table tbody tr:last-child td { border-bottom: 0; }
.topic-table tbody th { font-weight: 650; }
.topic-table tr.is-selected { background: #f3efe3; box-shadow: inset 3px 0 0 var(--teal); }

.evidence dl { margin: 12px 0 0; display: grid; gap: 12px; }
.evidence dt { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 700; }
.evidence dd { margin: 2px 0 0; overflow-wrap: anywhere; }
.excerpt { margin: 0; padding: 10px 12px; border-left: 3px solid var(--teal); background: #fff; font-family: var(--mono); font-size: 0.85rem; line-height: 1.5; }
.chip { display: inline-block; font-size: 0.75rem; font-weight: 700; border: 1px solid var(--line-strong); border-radius: 4px; padding: 1px 7px; color: var(--muted); background: var(--bg); }

/* Quiz */
.q-block { display: grid; gap: 10px; }
.q-block legend { font-weight: 650; padding-bottom: 6px; }
.options { display: grid; gap: 8px; }
.option { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; cursor: pointer; }
.option:hover { border-color: var(--line-strong); }
.option input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--teal); }
.option.is-chosen { border-color: var(--ink); }
.option.is-right { border-color: var(--teal); background: var(--teal-bg); }
.option.is-wrong { border-color: var(--red); background: var(--red-bg); }
.feedback { padding: 10px 12px; border-radius: var(--radius); border: 1px solid var(--line-strong); background: var(--bg); }
.feedback.f-ok { border-color: var(--teal); }
.feedback.f-bad { border-color: var(--red); }
.feedback strong { margin-right: 6px; }

/* Plan */
.plan-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.plan-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: grid; gap: 8px; }
.plan-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.plan-rank { width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; }
.plan-min { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
.plan-item ul { margin: 0; padding-left: 20px; }
.plan-src { font-size: 0.875rem; color: var(--muted); }

/* Empty / loading */
.empty { text-align: center; padding: 40px 20px; border: 1px dashed var(--line-strong); border-radius: var(--radius); background: var(--surface); display: grid; gap: 12px; justify-items: center; }
.empty p { max-width: 52ch; color: var(--muted); }
.loading { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); }
.loading .bar-ind { width: 40px; height: 4px; background: var(--teal); border-radius: 2px; }

dialog { border: 1px solid var(--ink); border-radius: var(--radius); padding: 22px; max-width: 420px; background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgba(20, 33, 61, 0.45); }
dialog h2 { margin-bottom: 8px; }
dialog .row { margin-top: 18px; justify-content: flex-end; }

/* Responsive */
@media (max-width: 1100px) {
  .report-grid { grid-template-columns: 1fr; }
}
@media (max-width: 860px) {
  .topbar { padding: 8px 14px; gap: 10px; }
  .brand-tag, .mode-badge small { display: none; }
  .shell { display: block; }
  .nav {
    position: fixed; left: 0; right: 0; bottom: 0; top: auto; height: auto; z-index: 30;
    padding: 4px 6px calc(4px + env(safe-area-inset-bottom)); background: var(--surface); border-right: 0; border-top: 1px solid var(--line-strong);
  }
  .nav ol { grid-template-columns: repeat(5, 1fr); gap: 2px; }
  .nav-btn { grid-template-columns: 1fr; justify-items: center; row-gap: 2px; padding: 6px 2px; text-align: center; }
  .nav-num { grid-row: auto; width: 24px; height: 24px; }
  .nav-label { font-size: 0.75rem; }
  .nav-sub { display: none; }
  .main { padding: 22px 16px 110px; }
  h1 { font-size: 1.4rem; }
  .form-grid, .indicators { grid-template-columns: 1fr; }
  .pdf-row { grid-template-columns: 1fr; }
}
@media (max-width: 720px) {
  .table-wrap { border: 0; background: transparent; overflow: visible; }
  .topic-table thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
  .topic-table, .topic-table tbody, .topic-table tr, .topic-table th, .topic-table td { display: block; width: 100%; }
  .topic-table tr { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 10px; padding: 6px 4px; }
  .topic-table tr.is-selected { box-shadow: inset 3px 0 0 var(--teal); }
  .topic-table th, .topic-table td { border-bottom: 0 !important; padding: 6px 12px; }
  .topic-table td { display: grid; grid-template-columns: 110px 1fr; gap: 8px; align-items: center; }
  .topic-table td::before { content: attr(data-label); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 700; }
  .badge { white-space: normal; }
  .topic-item { grid-template-columns: 1fr auto; }
  .topic-idx { display: none; }
  .btn { width: auto; }
}
select { max-width:100%; padding:10px; border:1px solid var(--line-strong); border-radius:var(--radius); background:var(--surface); }
.roadmap-layout { display:grid; grid-template-columns:minmax(240px, 0.85fr) minmax(0, 1.3fr); gap:20px; align-items:start; }
.roadmap-route { list-style:none; padding:0; margin:0; }
.route-node { width:100%; text-align:left; display:grid; gap:10px; padding:16px; background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--radius); cursor:pointer; }
.route-node:hover { border-color:var(--teal); }
.route-selected { border:2px solid var(--teal); background:var(--teal-bg); }
.route-node .badge { width:fit-content; white-space:normal; }
.route-connector { color:var(--teal); text-align:center; height:30px; padding-top:3px; }
.study-check { display:flex; gap:8px; align-items:center; font-size:0.85rem; padding:8px 2px; }
.study-check input { width:18px; height:18px; accent-color:var(--teal); }
@media(max-width:860px) { .roadmap-layout { grid-template-columns:1fr; } }
</style>
</head>

<a class="skip-link" href="#view-root">Skip to content</a>

<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" width="32" height="32" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
      <path d="M5 7h22M16 7v19" fill="none" stroke="#14213d" stroke-width="2.8" stroke-linecap="round"/>
      <circle cx="5" cy="7" r="3" fill="#0f6f68"/>

      <button class="btn btn-danger" value="confirm" type="submit" id="reset-confirm">Reset everything</button>

</dialog>

<!-- ===================================================================
     TensorService: sample data + data access.
     Everything below is synthetic. Each method notes the FastAPI endpoint
     that will replace it. The UI code only talks to this object.
     =================================================================== -->
<script id="tensor-service">
const TensorService = (() => {
  'use strict';

  const DOC = 'Sample_Java_OOP_Notes.pdf (synthetic)';

  const SAMPLE_INPUTS = {
    course: 'Java 17 Object-Oriented Programming, Unit 3 (sample)',
    minutes: '45',
    syllabus: [
      'Unit 3: Object-Oriented Programming in Java',
      '3.1 Classes and objects: fields, methods, instances',
      '3.2 Constructors: default and parameterised constructors',
      '3.3 Encapsulation: private fields, getters and setters',
      '3.4 Inheritance: extends, super and constructor chaining',
      '3.5 Method overriding: redefining inherited methods',
      '3.6 Polymorphism: parent-type references to child objects'
    ].join('\n'),
    notes: [
      '[Page 2] Classes and objects',
      'A class is a blueprint that defines fields and methods. An object is an instance of a class, created with the new keyword. Each object keeps its own copy of the instance fields.',
      '',
      '[Page 4] Constructors',
      'A constructor has the same name as its class and no return type. It runs when an object is created with new and is used to initialise fields. A parameterised constructor accepts arguments, for example Point(int x, int y), to initialise fields with supplied values. If a class defines no constructor, the compiler supplies a default no-argument constructor.',
      '',
      '[Page 6] Encapsulation',
      'Encapsulation keeps fields private and exposes controlled access through public getter and setter methods. A setter can validate input before it changes the field.',
      '',
      '[Page 8] Inheritance',
      'A subclass inherits fields and methods from its superclass using the extends keyword. Example: class Dog extends Animal.',
      '',
      '[Page 10] Polymorphism',
      'A variable of a parent type can refer to an object of a child type. Code written against the parent type can work with any child object.'

  Object.assign(QUIZ_KEY, {"q5": 0, "q6": 1, "q7": 2, "q8": 1, "q9": 2, "q10": 1, "q11": 1, "q12": 0, "q13": 2, "q14": 0, "q15": 2, "q16": 1, "q17": 2, "q18": 0, "q19": 2, "q20": 1});

    async uploadPdf(file, kind) {

        const data = await response.json().catch(() => null);
        if (!response.ok) {
          const detail = data && data.detail;
          throw new Error(Array.isArray(detail) ? detail.map((x) => x.msg || 'Invalid upload').join('; ')

        if (!data || !data.document_id || typeof data.text !== 'string' || !Array.isArray(data.pages))

        return data;
      } catch (error) {
        if (error.name === 'AbortError') throw new Error('PDF extraction timed out. Try a smaller document.');

      } finally { clearTimeout(timer); }
    },

    async callAPI(path, payload) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 20000);
      try {
        const response = await fetch(path, { method: payload === undefined ? 'GET' : 'POST',
          headers: payload === undefined ? {} : { 'Content-Type': 'application/json' },
          body: payload === undefined ? undefined : JSON.stringify(payload), signal: controller.signal });
        const data = await response.json().catch(() => null);
        if (!response.ok) {
          const detail = data && data.detail;
          throw new Error(Array.isArray(detail) ? detail.map((x) => x.msg || 'Invalid input').join('; ')
            : (typeof detail === 'string' ? detail : 'Request failed (' + response.status + ').'));
        }
        if (!data) throw new Error('The backend returned an empty response.');
        return data;
      } catch (error) {
        if (error.name === 'AbortError') throw new Error('Request timed out. Check the server.');
        throw error;
      } finally { clearTimeout(timer); }
    },

    async cancelActiveJob() {
      const id = this.activeJob;
      if (!id) return;
      return this.callAPI('/api/jobs/' + encodeURIComponent(id) + '/cancel', {});
    },

    async runJob(operation, payload, onProgress) {
      const began = Date.now();
      const started = await this.callAPI('/api/jobs/' + operation, payload);
      if (!started.job_id) throw new Error('The server did not return an analysis job ID.');
      const id = started.job_id;
      this.activeJob = id;
      const limits = {extract:180,coverage:300,quiz:300,check:35};
      const limit = Math.min(started.time_limit_seconds || limits[operation] || 180, limits[operation] || 180);
      const deadline = began + limit*1000 + 10000;
      try {
        while (Date.now() < deadline) {
          const job = await this.callAPI('/api/jobs/' + encodeURIComponent(id));
          const elapsed = Number.isFinite(job.elapsed_seconds) ? job.elapsed_seconds : Math.floor((Date.now()-began)/1000);
          if (onProgress && onProgress((job.progress || 'Processing…') + ' · ' + elapsed + 's / ' + limit + 's limit') === false) {
            await this.callAPI('/api/jobs/' + encodeURIComponent(id) + '/cancel', {}).catch(()=>{});
            throw new Error('Analysis view changed. The old job was asked to stop.');
          }
          if (job.status === 'failed') throw new Error(job.error || 'Analysis failed.');
          if (job.status === 'cancelled') throw new Error('Analysis stopped. Your inputs are kept.');
          if (job.status === 'completed') return job.result;
          await wait(1000);
        }
        await this.callAPI('/api/jobs/' + encodeURIComponent(id) + '/cancel', {}).catch(()=>{});
        throw new Error('Analysis reached its time limit. Your inputs are kept. Enter topics manually or try the labelled sample demo.');
      } finally {
        if (this.activeJob === id) this.activeJob = null;
      }
    },

    async analyzeCoverage(inputs, topics, onProgress) {
      const data = await this.runJob('coverage', {
        course: inputs.course, notes: inputs.notes, notes_document_id: inputs.notesDocumentId || null,
        topics: topics.map((t) => ({id:t.id, name:t.name, syllabus_excerpt:t.source_verified ? (t.syllabus_excerpt || '') : ''}))

          || data.topics.length !== topics.length) throw new Error('The backend returned an incomplete coverage report.');
      const ids = new Set(data.topics.map(t => t.id));
      if (ids.size !== topics.length || topics.some(t => !ids.has(t.id))) throw new Error('Mismatched coverage topic IDs.');
      if (data.topics.some(t => !['covered','partial','none','uncertain'].includes(t.coverage) || !t.evidence))
        throw new Error('Invalid coverage data.');
      return data;
    },

    async extractTopics(inputs, onProgress) {
      const data = await this.runJob('extract', {course:inputs.course, syllabus:inputs.syllabus,

    // FastAPI later: GET /api/sample
    getSampleInputs() { return clone(SAMPLE_INPUTS); },

    // True when the user's text matches the built-in sample. Used only to tell

    isSampleInput(inputs) {

    // FastAPI later: POST /api/analyze  (syllabus, notes, pdf uploads)
    // Prototype: always returns the built-in sample topics, whatever the inputs were.
    async preparePreview(/* inputs */) {
      await wait(50);
      return { mode: 'sample', topics: clone(TOPICS) };

    // FastAPI later: GET /api/topics/extracted
    getSampleTopics() { return clone(TOPICS); },

    // FastAPI later: GET /api/quiz  (answer key stays server-side)
    getQuiz(count = 10) { return clone(selectSampleQuestions(count)); },
    summarizeAnswers,

    // FastAPI later: POST /api/quiz/score
    scoreQuiz(answers, count = 10) {
      const items = selectSampleQuestions(count).map((q) => {
        const chosen = answers[q.id];
        const correctIndex = QUIZ_KEY[q.id];
        return { questionId: q.id, topicId: q.topicId, chosen, correctIndex,
                 isCorrect: chosen === correctIndex, explanation: q.explanation };
      });
      return { total: items.length, correctCount: items.filter((i) => i.isCorrect).length, items };
    },

    // FastAPI later: POST /api/recheck/question, POST /api/recheck/score
    hasFollowUp(topicId) { return Object.prototype.hasOwnProperty.call(FOLLOW, topicId); },
    getFollowUp(topicId) { return FOLLOW[topicId] ? clone(FOLLOW[topicId]) : null; },
    checkFollowUp(topicId, choice) {
      const correctIndex = FOLLOW_KEY[topicId];
      return { isCorrect: choice === correctIndex, correctIndex, explanation: FOLLOW[topicId].explanation };
    },

    // FastAPI later: POST /api/plan
    // Weights: notes coverage gap (none 3, partial 2, uncertain 2) plus 3 if the
    // diagnostic answer for that topic was incorrect. Minutes come in 5-minute
    // units and never sum to more than the available time.
    buildPlan({ topics, quizResult, minutes }) {
      const W = { covered: 0, partial: 2, none: 3, uncertain: 2 };
      const qmap = new Map(summarizeAnswers(quizResult ? quizResult.items : []).map((x) => [x.topicId, x]));
      const flagged = topics.map((topic, order) => {
        const quizItem = qmap.get(topic.id) || null;
        return { topic, quizItem, order, score: W[topic.coverage] + (quizItem && !quizItem.isCorrect ? 3 : 0) };
      }).filter((x) => x.score > 0)
        .sort((a, b) => b.score - a.score || a.order - b.order);

      const units = Math.max(0, Math.floor(minutes / 5));
      const chosen = flagged.slice(0, units);
      const omitted = flagged.length - chosen.length;
      if (!chosen.length) return { items: [], omitted, flaggedCount: flagged.length, totalMinutes: 0 };

      const spare = units - chosen.length;
      const totalScore = chosen.reduce((s, x) => s + x.score, 0);
      const exact = chosen.map((x) => (spare * x.score) / totalScore);
      const alloc = exact.map(Math.floor);
      const left = spare - alloc.reduce((a, b) => a + b, 0);
      exact.map((e, i) => ({ i, f: e - Math.floor(e) }))
        .sort((a, b) => b.f - a.f || a.i - b.i)
        .slice(0, left)
        .forEach((o) => { alloc[o.i] += 1; });

      const items = chosen.map((x, i) => Object.assign({}, x, { minutes: (1 + alloc[i]) * 5 }));
      return { items, omitted, flaggedCount: flagged.length, totalMinutes: items.reduce((s, x) => s + x.minutes, 0) };
    }
  };
})();

  async function runCoverage() {

    const requestState = state;
    const topics = state.topics.map((t) => ({ ...t }));

    try {

      if (state !== requestState) return;

      state.topics = res.topics.map((t) => ({ ...oldTopics.get(t.id), ...t }));

  function viewTopics() {
    if (!state.analysis) {

    function addTopic() {
      const name = state.newTopic.trim();
      if (state.topics.length >= 100) { state.topicMsg = 'Use at most 100 topics per report.'; render(); return; }
      if (!name) { state.topicMsg = 'Enter a topic name first.'; render(); focusId('new-topic'); return; }
      state.topicsConfirmed = false; invalidateCoverage();
      state.addedCount += 1;
      state.topics.push({ id: 'u' + state.addedCount, name, syllabusRef: 'Added by you', coverage: 'uncertain', gap: '',
        evidence: { doc: 'Not analysed', page: null, excerpt: null,
          explanation: 'You added this topic. Notes coverage has not been analysed for this manually added topic.' } });
      state.newTopic = ''; state.topicMsg = '';
      render(); focusId('new-topic');
    }
    function proceed() {
      const empties = state.topics.filter((t) => !t.name.trim());
      const seen = new Set(), dups = [];
      state.topics.forEach((t) => { const k = t.name.trim().toLowerCase(); if (k && seen.has(k)) dups.push(t.name.trim()); seen.add(k); });
      const items = [];

  function reasonsFor(item) {
    const t = item.topic, out = [];
    out.push({
      covered: 'Notes: contain an explanation of this topic.',
      partial: 'Notes: only partly cover this topic. ' + t.gap,
      none: 'Notes: no passage explains this topic. ' + t.gap,
      uncertain: 'Notes: the available evidence is ambiguous or insufficient.'
    }[t.coverage]);
    if (!(state.mode === 'live' ? aggregateQuizResult() : state.quiz.result)) out.push('Quiz: not taken yet, so this ranking reflects notes coverage only.');
    else if (!item.quizItem) out.push('Quiz: no diagnostic question covered this topic (not assessed).');
    else if (item.quizItem.total > 1) out.push('Quiz: '+item.quizItem.correctCount+' of '+item.quizItem.total+' questions on this topic were answered correctly.'+(item.quizItem.isCorrect?'':' Review the missed questions.'));
    else if (item.quizItem.isCorrect) out.push('Quiz: you answered the diagnostic question correctly.');
    else out.push('Quiz: you answered the diagnostic question incorrectly' + (t.coverage === 'covered' ? ', even though the notes cover the topic. Notes coverage does not show understanding.' : '.'));
    return out;
  }
  function sourceFor(t) {
    const e = t.evidence;
    if (e && e.page) return e.doc + ', PDF page ' + e.page;
    if (e && e.passage_id) return e.doc + ', passage ' + e.passage_id;
    if (t.coverage === 'none') return 'No source passage found in the notes (' + t.syllabusRef + ')';
    return 'No source analysed (' + t.syllabusRef + ')';
  }

        ? h('div', { class: 'notice', role: 'note' }, h('strong', {}, 'Quiz not taken yet.'), 'This ranking reflects notes coverage only. ',
            h('button', { class: 'btn-link', type: 'button', onclick: () => go('quiz') }, 'Take the diagnostic quiz'), ' to add quiz evidence.')
        : null,
      h('section', { class: 'stack', 'aria-labelledby': 'plan-h' },
        h('h2', { id: 'plan-h' }, 'Prioritised study plan'),
        minutesCtl, body),
      recheckSection(concept, plan));
  }

  function recheckSection(concept, plan) {
    if (!concept) {
      return h('section', { class: 'panel', 'aria-labelledby': 'recheck-h' },
        h('h2', { id: 'recheck-h' }, 'Recheck'),
        h('p', { class: 'muted' }, plan && plan.items.length ? 'None of the planned topics has a follow-up question in the sample.' : 'No concept is flagged for a recheck right now.'));
    }
    if (state.followUp.topicId !== concept.id) state.followUp = { topicId: concept.id, answer: null, result: null };
    const q = TensorService.getFollowUp(concept.id);
    const fu = state.followUp;
    const diag = quizMap().get(concept.id);
    const resultItem = fu.result ? { correctIndex: fu.result.correctIndex } : null;

    function check() {
      if (fu.answer === null) { fu.msg = 'Choose an answer first.'; render(); focusId('recheck-msg'); return; }
      fu.msg = '';
      fu.result = TensorService.checkFollowUp(concept.id, fu.answer);
      render(); focusId('recheck-result');
    }

    return h('section', { class: 'panel stack', 'aria-labelledby': 'recheck-h' },
      h('h2', { id: 'recheck-h' }, 'Recheck: ' + concept.name),
      h('p', { class: 'muted' }, 'A different question on the same concept. One answer is a single data point.'),
      questionBlock(q, 0, 'followup', fu.answer, (v) => { fu.answer = v; fu.msg = ''; }, resultItem),
      fu.msg ? h('p', { id: 'recheck-msg', tabindex: '-1', role: 'alert', style: 'color:var(--red);font-weight:600' }, fu.msg) : null,
      fu.result
        ? h('div', { class: 'feedback ' + (fu.result.isCorrect ? 'f-ok' : 'f-bad'), id: 'recheck-result', tabindex: '-1' },
            h('p', {}, h('strong', {}, 'Follow-up result: ' + (fu.result.isCorrect ? 'answered correctly.' : 'answered incorrectly.')),
              fu.result.isCorrect ? '' : ' The correct answer is ' + LETTERS[fu.result.correctIndex] + '.'),
            h('p', {}, fu.result.explanation),
            h('p', { class: 'small', style: 'margin-top:8px' },
              'Diagnostic quiz on this concept: ' + (diag ? (diag.total > 1 ? diag.correctCount+' of '+diag.total+' answered correctly' : (diag.isCorrect ? 'answered correctly' : 'answered incorrectly')) : 'not assessed') +
              '. Follow-up: ' + (fu.result.isCorrect ? 'answered correctly' : 'answered incorrectly') + '.'),
            h('p', { class: 'small muted' }, 'This is the result of one question. It does not show mastery or that your learning has improved.'))
        : h('div', { class: 'row' }, h('button', { class: 'btn btn-primary', type: 'button', onclick: check }, 'Check answer')));
  }

  function jobProgress(requestState) {
    return (message) => {
      if (state !== requestState) return false;
      if (state.loading) { state.loadingLabel = message; render(); }
      return true;
    };
  }
  function aggregateQuizResult() {
    const items = Object.values(state.quizHistory);
    return items.length ? {items, total:items.length, correctCount:items.filter(i => i.isCorrect).length} : null;
  }
  async function retryUnresolvedCoverage() {
    const topics = state.topics.filter(t => t.evidence && t.evidence.doc === 'Analysis incomplete');
    if (!topics.length || state.loading) return;
    const requestState = state;
    state.loading = true; state.error = null; render();
    try {
      const result = await TensorService.analyzeCoverage({...state.inputs,
        notesDocumentId:state.pdfDocuments.notes ? state.pdfDocuments.notes.document_id : null}, topics, jobProgress(requestState));
      if (state !== requestState) return;
      const replacements = new Map(result.topics.map(t => [t.id,t]));
      state.topics = state.topics.map(t => replacements.has(t.id) ? {...t,...replacements.get(t.id)} : t);
      state.coverageWarnings = result.warnings;
      state.notePassages = result.passages;
    } catch (error) { if (state !== requestState) return; state.error = {title:'Coverage retry failed',items:[error.message]}; }
    if (state !== requestState) return;
    state.loading = false; render();
  }
  async function createLiveQuiz() {
    const requestState = state;
    state.loading = true; state.loadingLabel = 'Preparing quiz…'; state.quiz.error = ''; render();
    try {
      const res = await TensorService.runJob('quiz', {
        course: state.inputs.course, question_count: state.quizCount, topic_offset: state.quizOffset,
        topics: state.topics.map((t) => ({ id: t.id, name: t.name, syllabus_excerpt: t.source_verified ? (t.syllabus_excerpt || '') : '' }))
      }, jobProgress(requestState));
      if (state !== requestState) return;
      state.liveQuiz = res;
      state.quiz = { answers: {}, result: null, error: '' };
      state.liveFollow.error = '';
      state.loading = false; render(); focusId('view-title');
    } catch (error) {
      if (state !== requestState) return;
      state.loading = false; state.quiz.error = error.message; render(); focusId('live-quiz-error');
    }
  }
  async function submitLiveQuiz() {
    const questions = state.liveQuiz.questions;
    if (questions.some((q) => state.quiz.answers[q.id] === undefined)) {
      state.quiz.error = 'Answer every question before submitting.'; render(); focusId('live-quiz-error'); return;
    }
    const requestState = state;
    state.loading = true; state.loadingLabel = 'Preparing quiz…'; state.quiz.error = ''; render();
    try {
      const res = await TensorService.callAPI('/api/quiz/score', { quiz_id: state.liveQuiz.quiz_id, answers: { ...state.quiz.answers } });
      if (state !== requestState) return;
      state.quiz.result = res;
      for (const item of res.items) {
        state.quizHistory[item.topicId] = item;
        state.topicQuizSessions[item.topicId] = state.liveQuiz.quiz_id;
        delete state.liveFollow.questions[item.topicId]; delete state.liveFollow.results[item.topicId]; delete state.liveFollow.answers[item.topicId];
      }
      state.loading = false; render(); focusId('live-quiz-summary');
    } catch (error) {
      if (state !== requestState) return;
      state.loading = false; state.quiz.error = error.message; render(); focusId('live-quiz-error');
    }
  }
  function viewLiveQuiz() {
    if (!state.coverageReady) return pendingLiveView('Diagnostic quiz');
    const quiz = state.liveQuiz, result = state.quiz.result;
    return h('div', { class: 'view' },
      header('Diagnostic quiz', 'Choose a batch of topics. Fixed Java questions are used where available; other topics use labelled AI-generated practice questions. Scoring stays on the server.'),
      h('div', { class: 'info-box' }, h('strong', {}, 'What this quiz supports'),
        'Up to 20 topics per batch, one question per topic. Move through batches to assess the confirmed syllabus. AI answers are not independently fact-checked; verify disputed answers with course materials.'),
      state.loading ? h('p',{role:'status'},state.loadingLabel || 'Preparing quiz…') : null,
      state.quiz.error ? h('div', { class: 'error-box', id: 'live-quiz-error', tabindex: '-1', role: 'alert' }, state.quiz.error) : null,
      h('section', {class:'panel stack'},
        h('p', {}, Object.keys(state.quizHistory).length + ' of ' + state.topics.length + ' topics assessed across completed batches.'),
        h('label', {for:'quiz-count'}, 'Questions per batch'),
        h('select', {id:'quiz-count', disabled:state.loading, onchange:e => {state.quizCount=Number(e.target.value); render();}},
          [5,10,20].map(n => h('option',{value:String(n), selected:state.quizCount===n},String(n)))),
        h('label', {for:'quiz-start'}, 'Start at topic'),
        h('select', {id:'quiz-start',disabled:state.loading,onchange:e => {state.quizOffset=Number(e.target.value); render();}},
          state.topics.map((t,index) => h('option',{value:String(index),selected:state.quizOffset===index},(index+1)+'. '+t.name))),
        h('p',{class:'small muted'}, 'The selection applies when you create the next quiz. Submitted evidence is retained per topic. A new submission for the same topic replaces its previous diagnostic result.')),
      !quiz ? h('section', { class: 'panel stack' },
        h('p', {}, 'Generate a diagnostic and a different follow-up question per selected topic. General-subject questions call Gemini and may take several minutes.'),
        h('button', { class: 'btn btn-primary', type: 'button', disabled: state.loading, onclick: createLiveQuiz }, state.loading ? 'Creating quiz…' : 'Create diagnostic quiz')) : null,
      quiz ? [
        h('p', { class: 'small muted' }, quiz.source),
        (quiz.warnings || []).map((text) => h('p', { class: 'small muted' }, text)),
        result ? h('section', { class: 'panel', id: 'live-quiz-summary', tabindex: '-1' },
          h('h2', {}, result.correctCount + ' of ' + result.total + ' answered correctly'),
          h('p', {}, 'The report now contains quiz evidence. Notes coverage is unchanged. One answer per topic is limited evidence.')) : null,
        h('form', { class: 'stack', onsubmit: (event) => { event.preventDefault(); if (!result && !state.loading) submitLiveQuiz(); } },
          quiz.questions.map((q, index) => {
            const item = result ? result.items.find((x) => x.questionId === q.id) : null;
            return h('section', { class: 'panel stack' },
              h('p', { class: 'small muted' }, 'Topic: ' + topicName(q.topicId)),
              h('p', {class:'small muted'}, q.source || quiz.source),
              questionBlock(q, index + 1, 'live-' + q.id, state.quiz.answers[q.id],
                (value) => { if (!state.loading) state.quiz.answers[q.id] = value; }, item),
              item ? h('div', { class: 'feedback ' + (item.isCorrect ? 'f-ok' : 'f-bad') },
                h('strong', {}, item.isCorrect ? 'Correct.' : 'Incorrect.'), item.explanation) : null);
          }),
          result ? h('div', { class: 'row' },
            h('button', { class: 'btn', type: 'button', onclick: () => go('report') }, 'View updated report'),
            h('button', { class: 'btn btn-primary', type: 'button', onclick: () => go('plan') }, 'Open study roadmap'),
            h('button', { class: 'btn', type: 'button', disabled: state.loading, onclick: createLiveQuiz }, 'Create selected batch'),
            quiz.next_offset < state.topics.length ? h('button', {class:'btn',type:'button',disabled:state.loading,onclick:() => {state.quizOffset=quiz.next_offset; createLiveQuiz();}}, 'Next topic batch') : null)
            : h('button', { class: 'btn btn-primary', type: 'submit', disabled: state.loading }, state.loading ? 'Scoring answers…' : 'Submit answers'))
      ] : null);
  }
  function selectRoadmap(id) {
    state.roadmapSelected = id; render(); focusId('roadmap-detail-title');
  }
  function routeConnector() {
    const el = h('div', { class: 'route-connector', 'aria-hidden': 'true' });
    el.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" focusable="false"><path d="M12 1v19m-4-4 4 4 4-4" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
    return el;
  }
  function planTask(it) {
    return h('li', { class: 'plan-item' },
      h('div', { class: 'plan-head' }, h('h3', {}, it.topic.name), covBadge(it.topic.coverage), h('span', { class: 'plan-min' }, it.minutes + ' min')),
      h('ul', {}, reasonsFor(it).map((reason) => h('li', {}, reason))),
      h('p', { class: 'plan-src' }, 'Source: ' + sourceFor(it.topic)),
      h('button', { class: 'btn btn-small', type: 'button', onclick: () => { state.evidenceId = it.topic.id; go('report'); } }, 'View evidence for ' + it.topic.name));
  }
  async function loadLiveFollow(topicId) {
    const requestState = state;
    state.loading = true; state.liveFollow.error = ''; render();
    try {
      const q = await TensorService.callAPI('/api/quiz/' + encodeURIComponent(state.topicQuizSessions[topicId]) + '/follow-up/' + encodeURIComponent(topicId));
      if (state !== requestState) return;
      state.liveFollow.questions[topicId] = q; state.loading = false; render(); focusId('live-recheck-heading');
    } catch (error) {
      if (state !== requestState) return;
      state.loading = false; state.liveFollow.error = error.message; render();
    }
  }
  async function scoreLiveFollow(topicId) {
    const choice = state.liveFollow.answers[topicId];
    if (choice === undefined) { state.liveFollow.error = 'Choose a follow-up answer first.'; render(); return; }
    const requestState = state;
    state.loading = true; state.liveFollow.error = ''; render();
    try {
      const result = await TensorService.callAPI('/api/quiz/recheck', { quiz_id: state.topicQuizSessions[topicId], topic_id: topicId, choice });
      if (state !== requestState) return;
      state.liveFollow.results[topicId] = result; state.loading = false; render(); focusId('live-recheck-result');
    } catch (error) {
      if (state !== requestState) return;
      state.loading = false; state.liveFollow.error = error.message; render();
    }
  }
  function liveRecheckSection(topic) {
    if (!topic) return null;
    const result = state.liveFollow.results[topic.id], question = state.liveFollow.questions[topic.id];
    const diagnostic = quizMap().get(topic.id);
    return h('section', { class: 'panel stack' },
      h('h2', { id: 'live-recheck-heading', tabindex: '-1' }, 'Recheck: ' + topic.name),
      h('p', { class: 'small muted' }, 'A different question checks the same concept. Results remain separate from task completion and notes coverage.'),
      state.liveFollow.error ? h('p', { class: 'error-box', role: 'alert' }, state.liveFollow.error) : null,
      !Object.keys(state.quizHistory).length ? h('button', { class: 'btn', type: 'button', onclick: () => go('quiz') }, 'Take diagnostic quiz first')
        : !diagnostic ? h('p', { class: 'muted' }, 'This topic has not been assessed yet. Choose its topic batch in Quiz to enable a paired recheck.')
        : !question ? h('button', { class: 'btn', type: 'button', disabled: state.loading, onclick: () => loadLiveFollow(topic.id) }, state.loading ? 'Loading question…' : 'Load follow-up question')
        : [questionBlock(question, 0, 'live-follow-' + topic.id, state.liveFollow.answers[topic.id],
              (value) => { if (!state.loading) state.liveFollow.answers[topic.id] = value; }, result),
            result ? h('div', { class: 'feedback ' + (result.isCorrect ? 'f-ok' : 'f-bad'), id: 'live-recheck-result', tabindex: '-1' },
              h('strong', {}, result.isCorrect ? 'Follow-up answered correctly.' : 'Follow-up answered incorrectly.'),
              h('p', {}, result.explanation),
              h('p', { class: 'small' }, 'Diagnostic: ' + (diagnostic.isCorrect ? 'correct' : 'incorrect') + '. Follow-up: ' + (result.isCorrect ? 'correct' : 'incorrect') + '.'),
              h('p', { class: 'small muted' }, 'One follow-up answer does not establish mastery or prove learning improvement.'))
            : h('button', { class: 'btn btn-primary', type: 'button', disabled: state.loading, onclick: () => scoreLiveFollow(topic.id) }, state.loading ? 'Checking answer…' : 'Check follow-up answer')]);
  }
  function viewLivePlan() {
    if (!state.coverageReady) return pendingLiveView('Study plan and recheck');
    const mins = minutesValue();
    const plan = mins === null ? null : TensorService.buildPlan({ topics: state.topics, quizResult: state.mode === 'live' ? aggregateQuizResult() : state.quiz.result, minutes: mins });
    const selected = plan && (plan.items.find((it) => it.topic.id === state.roadmapSelected) || plan.items[0]);
    const studied = plan ? plan.items.filter((it) => state.studyDone[it.topic.id]).length : 0;
    return h('div', { class: 'view' },
      header('Study plan and roadmap', 'Priorities combine notes gaps with diagnostic answers. Arrows show suggested study order. Topic blocks include review and practice time.'),
      h('div', { class: 'notice' }, h('strong', {}, 'How the ranking works'),
        'Missing notes: 3 points; partial or uncertain coverage: 2; an incorrect diagnostic answer: +3. These are prototype rules, not exam predictions.'),
      !Object.keys(state.quizHistory).length ? h('p', { class: 'small muted' }, 'Quiz not taken: this plan uses notes coverage only.') : null,
      field('live-plan-minutes', 'Available study time (minutes)',
        h('input', { id: 'live-plan-minutes', type: 'number', min: '5', max: '10080', step: '1', value: state.inputs.minutes, disabled: state.loading,
          onchange: (event) => { state.inputs.minutes = event.target.value; render(); focusId('live-plan-minutes'); } }),
        'Between 5 and 10,080. Allocations use 5-minute blocks and never exceed this budget.'),
      !plan ? h('div', { class: 'error-box', role: 'alert' }, 'Enter a whole number between 5 and 10,080.')
        : !plan.items.length ? h('div', { class: 'empty' }, h('h2', {}, 'Nothing flagged by the current evidence'), h('p', {}, 'This is not proof of mastery. More practice may reveal other gaps.'))
        : [h('p', { role: 'status' }, plan.totalMinutes + ' of ' + mins + ' minutes allocated. ' + (plan.omitted ? plan.omitted + ' flagged topic(s) do not fit. ' : '') + studied + ' of ' + plan.items.length + ' tasks marked studied.'),
            h('div', { class: 'row', role: 'group', 'aria-label': 'Study plan view' },
              h('button', { class: 'btn', type: 'button', 'aria-pressed': state.planView === 'roadmap' ? 'true' : 'false', onclick: () => { state.planView = 'roadmap'; render(); } }, 'Visual roadmap'),
              h('button', { class: 'btn', type: 'button', 'aria-pressed': state.planView === 'list' ? 'true' : 'false', onclick: () => { state.planView = 'list'; render(); } }, 'List view')),
            state.planView === 'list' ? h('ol', { class: 'plan-list' }, plan.items.map(planTask))
              : h('div', { class: 'roadmap-layout' },
                h('ol', { class: 'roadmap-route', 'aria-label': 'Suggested study sequence' }, plan.items.map((it, index) =>
                  h('li', {},
                    h('button', { class: 'route-node' + (selected.topic.id === it.topic.id ? ' route-selected' : ''), type: 'button',
                      'aria-pressed': selected.topic.id === it.topic.id ? 'true' : 'false', onclick: () => selectRoadmap(it.topic.id) },
                      h('span', { class: 'small muted' }, 'Step ' + (index + 1) + ' · ' + it.minutes + ' min'),
                      h('strong', {}, it.topic.name), covBadge(it.topic.coverage), quizBadge(quizMap().get(it.topic.id))),
                    h('label', { class: 'study-check' }, h('input', { type: 'checkbox', checked: !!state.studyDone[it.topic.id], onchange: (event) => { state.studyDone[it.topic.id] = event.target.checked; render(); } }), 'Mark ' + it.topic.name + ' as studied'),
                    index < plan.items.length - 1 ? routeConnector() : null))),
                h('section', { class: 'panel stack' }, h('h2', { id: 'roadmap-detail-title', tabindex: '-1' }, selected.topic.name),
                  h('p', {}, selected.minutes + ' minutes for review and practice.'),
                  h('ul', {}, reasonsFor(selected).map((reason) => h('li', {}, reason))),
                  h('p', { class: 'small' }, 'Source: ' + sourceFor(selected.topic)),
                  selected.topic.evidence.excerpt ? h('blockquote', { class: 'excerpt' }, selected.topic.evidence.excerpt)
                    : h('p', { class: 'muted' }, 'No supporting passage was found in the supplied notes. Use your course material or ask your instructor for a reference.'),
                  h('button', { class: 'btn', type: 'button', onclick: () => { state.evidenceId = selected.topic.id; go('report'); } }, 'Open source evidence'),
                  h('p', { class: 'small muted' }, 'Marking a task studied is self-reported progress; quiz and recheck results are separate.'))),
            liveRecheckSection(selected.topic)]);
  }

  /* ---------- Render ---------- */
  function render() {
    const badge = document.querySelector('.mode-badge');
    badge.replaceChildren(document.createTextNode(state.mode === 'live' ? 'Live analysis' : 'Sample mode'),
      h('small', {}, state.mode === 'live' ? 'Coverage · quiz · roadmap' : 'Synthetic data, no AI requests'));
    const map = { inputs: viewInputs, topics: viewTopics, report: viewReport, quiz: viewQuiz, plan: viewPlan };
    root.replaceChildren(map[state.view]());
    root.prepend(h('p',{class:'session-notice'},
      h('strong',{},'Temporary session. '),
      'Refreshing or closing this tab clears your inputs, report and quiz progress. Moving between Tensor steps keeps your work.'));
    if (state.loading && TensorService.activeJob) root.prepend(
      h('div',{class:'notice stack',role:'status'},
        h('p',{},state.loadingLabel || 'Analysis in progress…'),
        h('div',{class:'row'},
          h('button',{class:'btn',type:'button',onclick:stopAnalysis},'Stop analysis'),
          h('button',{class:'btn',type:'button',onclick:startInstantDemo},'Open sample demo (no AI)'))));
    if (state.loading) root.querySelectorAll('input, textarea, select').forEach((el) => { el.disabled = true; });
    renderNav();
  }

  /* ---------- Reset ---------- */
  const dlg = document.getElementById('reset-dialog');
  function doReset() { TensorService.cancelActiveJob().catch(()=>{}); releaseAllPdfs(); state = freshState(); render(); window.scrollTo(0, 0); focusId('view-title'); }
  document.getElementById('reset-btn').addEventListener('click', () => {
    if (typeof dlg.showModal === 'function') dlg.showModal();
    else if (window.confirm('Reset everything and return to the Inputs step?')) doReset();
  });
  dlg.addEventListener('close', () => { if (dlg.returnValue === 'confirm') doReset(); dlg.returnValue = ''; });

  render();
})();
</script>
</body>
</html>
